name: ax-fabric
services:
  retrieval-evaluator:
    build:
      context: ../services/ingestion-worker
    entrypoint: ["python", "-m", "app.evaluate_retrieval"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@ax-postgres:5432/${POSTGRES_DB}
      EVALUATION_DATASET: /app/evaluation/odoo_lexical_v1.json
      EVALUATION_OUTPUT: /results/odoo-lexical-v1-results.json
    volumes:
      - ../data/evaluations:/results
    networks:
      - ax-fabric
networks:
  ax-fabric:
    external: true
    name: ax-fabric
