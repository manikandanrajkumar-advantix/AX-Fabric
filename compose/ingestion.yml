name: ax-fabric
services:
  ingestion-worker:
    build:
      context: ../services/ingestion-worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@ax-postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT: http://ax-minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      ODOO_SOURCE_ROOT: /sources
      ODOO_SOURCE_REVISION: ${ODOO_SOURCE_REVISION}
      ODOO_VERSION: ${ODOO_VERSION:-19.0}
    volumes:
      - ${ODOO_SOURCE_PATH:-../data/sources/odoo-community-19}:/sources:ro
    networks:
      - ax-fabric
networks:
  ax-fabric:
    external: true
    name: ax-fabric
